[tool.poetry]
name = "plumerise"
version = "0.1.0"
description = "Model of wind-blown volcanic plumes"
authors = ["Mark Woodhouse <mark.woodhouse@bristol.ac.uk>"]

[tool.poetry.dependencies]
python = ">=3.10,<4"
DateTime = "^4.4"
dash = "^2.4.1"
dash-bootstrap-components = "^1.1.0"
plotly = "^5.8.0"
numpy = ">=1.18"
pandas = ">=1.4.2"
scipy = ">=1.8.0"
numba = ">=0.57.0"
MetPy = ">=1.3.0"
siphon = "^0.9"
textwrap3 = "^0.9.2"
Pint = "^0.19.2"
dash-extensions = "^0.1.1"
dash-mantine-components = "^0.8.0"
geopy = "^2.2.0"
dash-daq = "^0.5.0"
pyDOE = "^0.3.8"
diskcache = "^5.4.0"
multiprocess = "^0.70.13"
psutil = "^5.9.1"
pyproj = ">=3.6.0"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
