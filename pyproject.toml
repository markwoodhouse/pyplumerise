[tool.poetry]
name = "plumerise"
version = "1.0.0"
description = "Model of wind-blown volcanic plumes"
authors = ["Mark Woodhouse <mark.woodhouse@bristol.ac.uk>"]
license = "BSD-3-Clause"
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
    { path = "plumerise/app/assets/**", format = ["sdist", "wheel"] },
    { path = "plumerise/data/igra2-station-list.pkl", format = ["sdist", "wheel"] },
    { path = "plumerise/data/igra2-station-list.txt", format = ["sdist", "wheel"] },
    { path = "plumerise/notebooks/*.ipynb", format = ["sdist", "wheel"] },
    { path = "THIRD_PARTY_NOTICES.md", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.10"
DateTime = "^4.4"
dash = "^2.4.1"
dash-bootstrap-components = "^1.1.0"
plotly = "^5.8.0"
numpy = ">2"
pandas = ">2"
scipy = ">1.8.0"
numba = ">0.55"
MetPy = ">1.6"
textwrap3 = "^0.9.2"
Pint = ">0.24.1"
dash-extensions = "^0.1.1"
dash-mantine-components = "^0.8.0"
geopy = "^2.2.0"
dash-daq = "^0.5.0"
pyDOE = "^0.3.8"
diskcache = "^5.4.0"
multiprocess = "^0.70.13"
psutil = "^5.9.1"
cdsapi = "^0.7.0"
netCDF4 = "^1.6.5"
notebook = "^7.1.3"
click = "^8.1.7"
ipywidgets = "^8.1.9"
requests = "^2.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.poetry.scripts]
plumerise-example = "plumerise.scripts.example:run_example"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
